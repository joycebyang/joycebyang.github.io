<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Work in progress">
  <title>Work in progress</title>
  <style>
    .dot { animation: pulse 1.4s ease-in-out infinite; }
    .d2 { animation-delay: 0.2s; }
    .d3 { animation-delay: 0.4s; }
    @keyframes pulse { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; opacity: 0.7; } }
  </style>
  <defs>
    <pattern id="stripes" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="22" height="44" fill="#1d5c66" fill-opacity="0.09" />
    </pattern>
  </defs>
  <rect width="800" height="450" fill="#eef3f4" />
  <rect width="800" height="450" fill="url(#stripes)" />
  <rect x="150" y="115" width="500" height="220" rx="22" fill="#ffffff" stroke="#d3e0e2" stroke-width="2" />
  <circle class="dot d1" cx="355" cy="185" r="14" fill="#1d5c66" />
  <circle class="dot d2" cx="400" cy="185" r="14" fill="#1d5c66" />
  <circle class="dot d3" cx="445" cy="185" r="14" fill="#1d5c66" />
  <text x="400" y="272" text-anchor="middle" fill="#18212b" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="600">Work in progress</text>
</svg>
