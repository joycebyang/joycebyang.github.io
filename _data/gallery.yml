# Gallery folders shown on /gallery/, in this order.
#
# To add photos to a folder:
#   1. Put the image files in assets/img/gallery/<id>/  (e.g. assets/img/gallery/rss-2026/poster.jpg)
#   2. List them under that folder's `photos`, each with a `file` and an optional `caption`.
# The first two photos also peek out of the folder icon.
#
# Example:
#   photos:
#     - file: poster.jpg
#       caption: Presenting our poster

